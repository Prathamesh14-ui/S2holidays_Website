name: Sanity backup

# Weekly export of the Sanity dataset (content + enquiries + image assets).
# Requires repository secrets:
#   SANITY_AUTH_TOKEN               – a Sanity API token with read access ("Viewer")
#   NEXT_PUBLIC_SANITY_PROJECT_ID   – the Sanity project ID
# Backups are stored as private workflow artifacts for 90 days. The export contains
# customer enquiries (personal data): keep this repository private and restrict access.
on:
  schedule:
    - cron: "17 21 * * 0" # Sundays 21:17 UTC (Monday 02:47 IST)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export dataset
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: production
        run: npx sanity dataset export production "backup-$(date +%Y-%m-%d).tar.gz" --overwrite
      - uses: actions/upload-artifact@v4
        with:
          name: sanity-backup-${{ github.run_id }}
          path: backup-*.tar.gz
          retention-days: 90
